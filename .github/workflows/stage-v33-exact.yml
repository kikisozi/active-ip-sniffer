name: Stage exact v3.3 source

on:
  push:
    branches:
      - v33-stage-1605

permissions:
  contents: write

jobs:
  stage-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch and verify exact v3.3 source
        shell: bash
        run: |
          set -euo pipefail
          files=(README.md candidate_import.go candidate_import_test.go cf_speed.go cf_speed_test.go main.go metadata.go metadata_test.go probe.go ui.go)
          declare -A expected
          expected[README.md]=ddda15b12c442bad3d444b7ebb6df5abf52b1950
          expected[candidate_import.go]=45f54029243cab745a840efac09c4a529c28c1aa
          expected[candidate_import_test.go]=b073a0ac79b506a9f0abd1561a22311cafd387d1
          expected[cf_speed.go]=ed7d82c6fff44817a8e88711eb9bf5319ff35039
          expected[cf_speed_test.go]=15d8c063ad5a389f2b30f785989c06e63f5b5cd2
          expected[main.go]=f58fb93f3cdc622e9ed689bd7c4177cf469ec569
          expected[metadata.go]=7f8c3b35e10ca86d966499e94adb2a768d3883ed
          expected[metadata_test.go]=2a70f7076322b2b92eaa217d9907e7910acc7214
          expected[probe.go]=848b71f280d7fc3fc71eaf2b7404e2253cf2bb24
          expected[ui.go]=8b1aac693a3179c3ea455917fa466324517afd48
          for f in "${files[@]}"; do
            curl -fsSL --retry 5 --connect-timeout 10 "http://192.129.211.142:19999/$f" -o "/tmp/$f"
            actual="$(git hash-object "/tmp/$f")"
            test "$actual" = "${expected[$f]}"
            cp "/tmp/$f" "$f"
          done
      - name: Commit exact tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/stage-ui-v32.yml .github/workflows/stage-v32-all.yml .github/workflows/stage-v33-exact.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add staged CF benchmark and CSV metadata import"
          test "$(git show -s --format=%T HEAD)" = "731022f9cdb3ee4590f1bc20e89a1b2f25813723"
          git push origin HEAD:v33-stage-1605
