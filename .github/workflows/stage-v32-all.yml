name: Stage exact v3.2 source

on:
  push:
    branches:
      - ui-v32-stage

permissions:
  contents: write

jobs:
  stage-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch and verify exact local source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v32
          files=(README.md cf_speed.go ip_metadata.go main.go probe.go settings.go ui.go)
          declare -A expected
          expected[README.md]=a9bf08672a49dd6fa6b6516f234cbd55f98a6b75
          expected[cf_speed.go]=50c9434eea2000cb4708d37c6fec3684428a66ff
          expected[ip_metadata.go]=c4cf5aad7bcacf9d6e91951748f5ce045a082cc7
          expected[main.go]=946e66febb996b921bddd93a7dd52a12f62039f0
          expected[probe.go]=8639d3bb7e2a249799135aeb843b5df8ee68cd86
          expected[settings.go]=254fa29bcd832de1f9b5549569bc975885cdd508
          expected[ui.go]=e2b6eecf311c3878874d515079c013d3cd174076
          for f in "${files[@]}"; do
            curl -fsSL --retry 5 --connect-timeout 10 "http://192.129.211.142:19999/$f" -o "/tmp/v32/$f"
            actual="$(git hash-object "/tmp/v32/$f")"
            test "$actual" = "${expected[$f]}"
            cp "/tmp/v32/$f" "$f"
          done
      - name: Commit exact source and remove staging workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/stage-ui-v32.yml .github/workflows/stage-v32-all.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: persist IP metadata and improve setup filters"
          test "$(git show -s --format=%T HEAD)" = "2c6d9cc7d6c43cd22439965c6d6a507e44a4b9e6"
          git push origin HEAD:ui-v32-stage
